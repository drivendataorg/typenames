name: docs-preview

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build docs and deploy preview
    runs-on: ubuntu-latest
    environment: docs-preview
    permissions:
      contents: read
      deployments: write # GitHub deployment for the preview
      pull-requests: write # Comment with the preview URL
      statuses: write # Commit status with the preview URL

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.55.0" # Keep in sync with minimum-version in justfile

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-suffix: "docs"

      - name: Build docs
        run: |
          just docs

      - name: Get preview identifier
        id: get_id
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            PREVIEW_IDENTIFIER="PR${PR_NUMBER}"
          else
            PREVIEW_IDENTIFIER="$(git rev-parse --short HEAD)"
          fi
          echo "PREVIEW_IDENTIFIER=$PREVIEW_IDENTIFIER" | tee -a "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.number }}

      - name: Deploy preview to Netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        with:
          publish-dir: "./docs/site"
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
          alias: typenames-${{ steps.get_id.outputs.PREVIEW_IDENTIFIER }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1
